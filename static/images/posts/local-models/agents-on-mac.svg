<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Local agent stack on a Mac">
  <rect width="960" height="400" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Yes - agents can run on a Mac</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">The model is local. The harness still uses tools on your machine.</text>

  <rect x="50" y="110" width="200" height="220" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="150" y="170" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">1. Model</text>
  <text x="150" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">Ollama on</text>
  <text x="150" y="235" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">localhost:11434</text>

  <rect x="280" y="110" width="200" height="220" rx="12" fill="#1e293b" stroke="#a78bfa"/>
  <text x="380" y="170" text-anchor="middle" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">2. Harness</text>
  <text x="380" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">Cursor / Continue</text>
  <text x="380" y="235" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">/ Open WebUI</text>

  <rect x="510" y="110" width="200" height="220" rx="12" fill="#1e293b" stroke="#22c55e"/>
  <text x="610" y="170" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">3. Tools</text>
  <text x="610" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">files, terminal,</text>
  <text x="610" y="235" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">MCP, browser</text>

  <rect x="740" y="110" width="180" height="220" rx="12" fill="#1e293b" stroke="#f59e0b"/>
  <text x="830" y="170" text-anchor="middle" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">4. Loop</text>
  <text x="830" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">act, observe,</text>
  <text x="830" y="235" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">repeat</text>
</svg>
