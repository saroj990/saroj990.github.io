<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="LCEL linear pipeline">
  <rect width="960" height="280" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">LCEL: a linear chain</text>

  <rect x="40" y="100" width="160" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="120" y="145" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Prompt</text>
  <text x="120" y="170" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">template</text>

  <text x="220" y="160" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="22">-&gt;</text>

  <rect x="260" y="100" width="160" height="100" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="340" y="145" text-anchor="middle" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Model</text>
  <text x="340" y="170" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">LLM call</text>

  <text x="440" y="160" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="22">-&gt;</text>

  <rect x="480" y="100" width="160" height="100" rx="10" fill="#1e293b" stroke="#f59e0b"/>
  <text x="560" y="145" text-anchor="middle" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Parser</text>
  <text x="560" y="170" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">structured out</text>

  <text x="660" y="160" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="22">-&gt;</text>

  <rect x="700" y="100" width="200" height="100" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="800" y="145" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Result</text>
  <text x="800" y="170" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">one pass, done</text>
</svg>
