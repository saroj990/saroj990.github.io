<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="LangGraph agent loop with tools">
  <rect width="960" height="480" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">LangGraph ReAct loop</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">State flows through nodes until the model stops calling tools</text>

  <rect x="360" y="100" width="240" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="480" y="142" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">START</text>

  <line x1="480" y1="170" x2="480" y2="200" stroke="#64748b" stroke-width="2"/>

  <rect x="330" y="200" width="300" height="80" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="480" y="235" text-anchor="middle" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">agent node</text>
  <text x="480" y="260" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13">LLM (+ bound tools)</text>

  <line x1="480" y1="280" x2="480" y2="310" stroke="#64748b" stroke-width="2"/>

  <rect x="330" y="310" width="300" height="60" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="348" text-anchor="middle" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">should_continue?</text>

  <path d="M330 340 H160 V240 H330" fill="none" stroke="#22c55e" stroke-width="2"/>
  <rect x="40" y="210" width="200" height="60" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="140" y="245" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">tools node</text>
  <text x="140" y="195" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">tool calls present</text>

  <line x1="630" y1="340" x2="780" y2="340" stroke="#f43f5e" stroke-width="2"/>
  <rect x="780" y="310" width="140" height="60" rx="10" fill="#1e293b" stroke="#f43f5e"/>
  <text x="850" y="348" text-anchor="middle" fill="#f43f5e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">END</text>
  <text x="850" y="290" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">final answer</text>

  <text x="480" y="430" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">tools -&gt; agent again (the cycle that LCEL alone does not give you)</text>
</svg>
