<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="HNSW multi-layer graph for approximate nearest neighbor search">
  <rect width="960" height="480" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">HNSW: skip-list style graph over vectors</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Search starts on a sparse top layer, then descends to denser layers</text>

  <!-- Layer 2 -->
  <text x="60" y="120" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Layer 2</text>
  <circle cx="250" cy="115" r="14" fill="#a78bfa"/>
  <circle cx="520" cy="115" r="14" fill="#a78bfa"/>
  <line x1="264" y1="115" x2="506" y2="115" stroke="#a78bfa" stroke-width="2"/>

  <!-- Layer 1 -->
  <text x="60" y="230" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Layer 1</text>
  <circle cx="200" cy="225" r="12" fill="#38bdf8"/>
  <circle cx="360" cy="210" r="12" fill="#38bdf8"/>
  <circle cx="520" cy="235" r="12" fill="#38bdf8"/>
  <circle cx="700" cy="220" r="12" fill="#38bdf8"/>
  <line x1="212" y1="225" x2="348" y2="210" stroke="#38bdf8" stroke-width="2"/>
  <line x1="372" y1="210" x2="508" y2="235" stroke="#38bdf8" stroke-width="2"/>
  <line x1="532" y1="235" x2="688" y2="220" stroke="#38bdf8" stroke-width="2"/>

  <!-- Layer 0 -->
  <text x="60" y="360" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Layer 0</text>
  <circle cx="160" cy="355" r="10" fill="#22c55e"/>
  <circle cx="260" cy="340" r="10" fill="#22c55e"/>
  <circle cx="360" cy="365" r="10" fill="#22c55e"/>
  <circle cx="460" cy="345" r="10" fill="#22c55e"/>
  <circle cx="560" cy="360" r="10" fill="#22c55e"/>
  <circle cx="660" cy="350" r="10" fill="#22c55e"/>
  <circle cx="760" cy="365" r="10" fill="#22c55e"/>
  <line x1="170" y1="355" x2="250" y2="340" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="270" y1="340" x2="350" y2="365" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="370" y1="365" x2="450" y2="345" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="470" y1="345" x2="550" y2="360" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="570" y1="360" x2="650" y2="350" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="670" y1="350" x2="750" y2="365" stroke="#22c55e" stroke-width="1.5"/>

  <!-- vertical links -->
  <line x1="250" y1="129" x2="260" y2="330" stroke="#64748b" stroke-dasharray="4 4"/>
  <line x1="520" y1="129" x2="560" y2="350" stroke="#64748b" stroke-dasharray="4 4"/>

  <text x="480" y="430" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Top layers jump far. Bottom layer holds all points for fine search.</text>
  <text x="480" y="455" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Tradeoff: recall vs latency controlled by efSearch / M parameters</text>
</svg>
