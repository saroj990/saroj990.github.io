<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="IVF clusters then searches nearby buckets">
  <rect width="960" height="420" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">IVF: cluster first, then search a few buckets</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Inverted File index - skip most of the database on each query</text>

  <ellipse cx="220" cy="220" rx="110" ry="90" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="215" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Cluster A</text>
  <circle cx="190" cy="190" r="6" fill="#64748b"/>
  <circle cx="240" cy="200" r="6" fill="#64748b"/>
  <circle cx="210" cy="250" r="6" fill="#64748b"/>

  <ellipse cx="480" cy="200" rx="120" ry="100" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="480" y="160" text-anchor="middle" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Cluster B (probed)</text>
  <circle cx="450" cy="190" r="6" fill="#fbbf24"/>
  <circle cx="500" cy="210" r="6" fill="#fbbf24"/>
  <circle cx="470" cy="240" r="6" fill="#fbbf24"/>
  <circle cx="520" cy="175" r="6" fill="#fbbf24"/>

  <ellipse cx="760" cy="230" rx="110" ry="90" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="760" y="225" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Cluster C</text>
  <circle cx="730" cy="200" r="6" fill="#64748b"/>
  <circle cx="780" cy="250" r="6" fill="#64748b"/>

  <circle cx="500" cy="320" r="10" fill="#f43f5e"/>
  <text x="500" y="355" text-anchor="middle" fill="#f43f5e" font-family="Arial, Helvetica, sans-serif" font-size="14">query vector</text>
  <text x="480" y="390" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">nprobe = how many nearest clusters to open</text>
</svg>
