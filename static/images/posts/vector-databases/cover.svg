<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Text becomes vectors then nearest neighbors are retrieved">
  <rect width="960" height="400" fill="#0f172a"/>
  <text x="480" y="42" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Vector databases store meaning as numbers</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Embed text, index vectors, find nearest neighbors at query time</text>

  <rect x="50" y="120" width="200" height="200" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Documents</text>
  <text x="150" y="215" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">chunks of text,</text>
  <text x="150" y="240" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">code, images</text>

  <text x="280" y="225" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">-&gt;</text>

  <rect x="320" y="120" width="200" height="200" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="420" y="175" text-anchor="middle" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Embeddings</text>
  <text x="420" y="215" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">vectors like</text>
  <text x="420" y="240" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">[0.12, -0.44, ...]</text>

  <text x="550" y="225" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">-&gt;</text>

  <rect x="590" y="120" width="320" height="200" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="750" y="175" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Vector index</text>
  <text x="750" y="215" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">fast approximate</text>
  <text x="750" y="240" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">nearest-neighbor search</text>
</svg>
