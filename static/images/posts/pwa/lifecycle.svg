<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Service worker update lifecycle">
  <rect width="960" height="400" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Updates must be intentional</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">A broken SW can brick the app for returning users</text>

  <rect x="40" y="120" width="180" height="180" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="130" y="190" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1. Install</text>
  <text x="130" y="225" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">precaching</text>

  <rect x="250" y="120" width="180" height="180" rx="12" fill="#1e293b" stroke="#a78bfa"/>
  <text x="340" y="190" text-anchor="middle" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">2. Activate</text>
  <text x="340" y="225" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">claim clients</text>

  <rect x="460" y="120" width="200" height="180" rx="12" fill="#1e293b" stroke="#22c55e"/>
  <text x="560" y="190" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">3. Fetch</text>
  <text x="560" y="225" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">serve strategy</text>

  <rect x="690" y="120" width="230" height="180" rx="12" fill="#1e293b" stroke="#f59e0b"/>
  <text x="805" y="180" text-anchor="middle" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">4. Update</text>
  <text x="805" y="215" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">new SW waiting</text>
  <text x="805" y="240" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">prompt user / skipWaiting</text>
</svg>
