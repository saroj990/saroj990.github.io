<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Core PWA building blocks">
  <rect width="960" height="420" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">The production baseline</text>

  <rect x="40" y="90" width="200" height="260" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="140" y="140" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">HTTPS</text>
  <text x="140" y="185" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">required for SW</text>
  <text x="140" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">except localhost</text>

  <rect x="260" y="90" width="200" height="260" rx="12" fill="#1e293b" stroke="#a78bfa"/>
  <text x="360" y="140" text-anchor="middle" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Manifest</text>
  <text x="360" y="185" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">name, icons,</text>
  <text x="360" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">display, start_url</text>

  <rect x="480" y="90" width="200" height="260" rx="12" fill="#1e293b" stroke="#22c55e"/>
  <text x="580" y="140" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Service</text>
  <text x="580" y="165" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Worker</text>
  <text x="580" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">cache + offline</text>
  <text x="580" y="235" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">+ updates</text>

  <rect x="700" y="90" width="220" height="260" rx="12" fill="#1e293b" stroke="#f59e0b"/>
  <text x="810" y="140" text-anchor="middle" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Ops layer</text>
  <text x="810" y="185" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">versioning,</text>
  <text x="810" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">metrics, QA</text>
</svg>
