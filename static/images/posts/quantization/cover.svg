<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Quantization shrinks model weights to fewer bits">
  <rect width="960" height="400" fill="#0f172a"/>
  <text x="480" y="42" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Quantization: fewer bits, same model shape</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Store weights with less precision so giants fit on laptops</text>

  <rect x="60" y="120" width="360" height="200" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="240" y="175" text-anchor="middle" fill="#f43f5e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">FP16 weights</text>
  <text x="240" y="215" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="15">2 bytes per parameter</text>
  <text x="240" y="245" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="15">7B model ~ 14 GB</text>
  <text x="240" y="285" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13">high fidelity, heavy RAM</text>

  <rect x="540" y="120" width="360" height="200" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="720" y="175" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Q4 weights</text>
  <text x="720" y="215" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="15">~0.5 bytes per parameter</text>
  <text x="720" y="245" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="15">7B model ~ 4-5 GB</text>
  <text x="720" y="285" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13">small error, laptop-friendly</text>
</svg>
