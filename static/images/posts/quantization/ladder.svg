<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Quality versus size across quantization levels">
  <rect width="960" height="400" fill="#0f172a"/>
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Typical quality / size ladder (GGUF-style)</text>

  <rect x="50" y="100" width="140" height="220" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="120" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Q2-Q3</text>
  <text x="120" y="200" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">smallest</text>
  <text x="120" y="230" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">more mistakes</text>

  <rect x="220" y="100" width="140" height="220" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="290" y="160" text-anchor="middle" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Q4</text>
  <text x="290" y="200" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">sweet spot</text>
  <text x="290" y="230" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">most local use</text>

  <rect x="390" y="100" width="140" height="220" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="460" y="160" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Q5-Q6</text>
  <text x="460" y="200" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">closer to</text>
  <text x="460" y="230" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">original</text>

  <rect x="560" y="100" width="140" height="220" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="630" y="160" text-anchor="middle" fill="#a78bfa" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Q8</text>
  <text x="630" y="200" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">near FP16</text>
  <text x="630" y="230" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">still compressed</text>

  <rect x="730" y="100" width="180" height="220" rx="10" fill="#1e293b" stroke="#f59e0b"/>
  <text x="820" y="160" text-anchor="middle" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">FP16/BF16</text>
  <text x="820" y="200" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">full half</text>
  <text x="820" y="230" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">precision</text>
</svg>
